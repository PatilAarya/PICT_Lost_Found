<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Parking 1, Ground level plan">
  <!-- Plan for Parking 1, Ground level. Each clickable room is a
       class="area" element whose id matches the area id in locations.json. -->
  <rect class="wall" x="10" y="10" width="580" height="280" fill="none" stroke="#1d3557" stroke-width="4"/>
  <g class="area-group">
    <rect class="area" id="parking-area" x="20" y="20" width="560" height="260" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="300" y="155.6" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d3557">Parking area</text>
  </g>
</svg>
