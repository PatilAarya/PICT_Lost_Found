<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Sports courts, Ground level plan">
  <!-- Plan for Sports courts, Ground level. Each clickable room is a
       class="area" element whose id matches the area id in locations.json. -->
  <rect class="wall" x="10" y="10" width="580" height="280" fill="none" stroke="#1d3557" stroke-width="4"/>
  <g class="area-group">
    <rect class="area" id="basketball-court" x="20" y="20" width="275" height="260" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="157.5" y="155.6" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d3557">Basketball court</text>
  </g>
  <g class="area-group">
    <rect class="area" id="volleyball-court" x="305" y="20" width="275" height="260" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="442.5" y="155.6" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d3557">Volleyball court</text>
  </g>
</svg>
