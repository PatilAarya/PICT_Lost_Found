<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Boys hostel, Ground floor plan">
  <!-- Rooms with class "area" can be tapped; their ids match locations.json. -->
  <rect class="wall" x="10" y="10" width="580" height="280" fill="none" stroke="#1d3557" stroke-width="4"/>
  <g class="area-group">
    <rect class="area" id="hostel-building" x="20" y="20" width="560" height="260" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="300" y="155.6" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d3557">Hostel building</text>
  </g>
</svg>
