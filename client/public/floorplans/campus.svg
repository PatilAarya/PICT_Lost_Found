    <text class="room-label" x="942" y="615.7" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1d3557">development</text>
    <text class="room-label" x="942" y="643.2" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1d3557">cell</text>
  </g>
  <g class="area-group">
    <rect class="area" id="boys-hostel" x="1053" y="524" width="242" height="145" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="1174" y="607.7" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Boys hostel</text>
  </g>
  <g class="area-group">
    <rect class="area" id="entrance" x="25" y="630" width="270" height="60" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="160" y="671.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Main entrance</text>
  </g>
</svg>
