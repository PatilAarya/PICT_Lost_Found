    <text class="room-label" x="868.5" y="348.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Volleyball</text>
  </g>
  <g class="area-group">
    <rect class="area" id="girls-hostel" x="1043" y="62" width="242" height="155" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="1164" y="150.7" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Girls hostel</text>
  </g>
  <g class="area-group">
    <rect class="area" id="canteen" x="1058" y="242" width="226" height="252" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="1171" y="379.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Canteen</text>
  </g>
  <g class="area-group">
