<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 710" role="img" aria-label="PICT campus map">
  <!-- Map of the PICT campus. Each clickable room is a
       class="area" element whose id matches the area id in locations.json. -->
  <rect class="wall" x="10" y="10" width="1300" height="690" fill="none" stroke="#1d3557" stroke-width="4"/>
  <g class="area-group">
    <rect class="area" id="parking-1" x="25" y="22" width="165" height="428" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="107.5" y="247.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Parking 1</text>
  </g>
  <g class="area-group">
    <rect class="area" id="a1" x="210" y="35" width="355" height="140" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="387.5" y="96.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">A1 building</text>
    <text class="room-label" x="387.5" y="136.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Central Library</text>
  </g>
  <g class="area-group">
    <rect class="area" id="a2" x="565" y="35" width="147" height="140" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="638.5" y="96.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">A2</text>
    <text class="room-label" x="638.5" y="136.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">building</text>
  </g>
  <g class="area-group">
    <rect class="area" id="a3" x="565" y="175" width="147" height="257" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="638.5" y="294.7" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">A3</text>
    <text class="room-label" x="638.5" y="334.7" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">building</text>
  </g>
  <g class="area-group">
    <rect class="area" id="sports-courts" x="740" y="42" width="257" height="390" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
