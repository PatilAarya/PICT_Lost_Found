    <text class="room-label" x="492.5" y="631.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Auditorium</text>
  </g>
  <g class="area-group">
    <rect class="area" id="parking-2" x="672" y="528" width="156" height="162" rx="8" fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    <text class="room-label" x="750" y="600.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">Parking</text>
    <text class="room-label" x="750" y="640.2" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1d3557">2</text>
